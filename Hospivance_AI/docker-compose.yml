services:
  postgres:
    image: postgres:16-alpine
    container_name: hospivance-postgres
    environment:
      POSTGRES_USER: hospivance
      POSTGRES_PASSWORD: hospivance
      POSTGRES_DB: hospivance
    ports:
      - "5432:5432"
    volumes:
      - hospivance_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospivance -d hospivance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hospivance_pg:
